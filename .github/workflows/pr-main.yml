name: 'Production: Run Verification + Tests'

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure public NPM registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set @feedhive:registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Test, typecheck and build
        run: |
          npm test
          npm run typecheck
          npm run build
